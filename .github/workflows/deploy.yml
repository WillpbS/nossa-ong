name: Deploy para GitHub Pages

# Roda automaticamente a cada push na branch principal,
# e também permite disparo manual pela aba Actions do GitHub
on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissões mínimas necessárias para publicar no GitHub Pages
# via OIDC (sem precisar de token/senha configurado manualmente)
permissions:
  contents: read
  pages: write
  id-token: write

# Evita duas publicações rodando ao mesmo tempo
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependências (usa o package-lock.json)
        run: npm ci

      - name: Build de produção com Vite (gera a pasta dist/)
        run: npm run build

      - name: Preparar o GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar a pasta dist/ como artefato de deploy
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
